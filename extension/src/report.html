<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mahamm</title>
<style>
  :root { --bg:#eef1f7; --bar:#fff; --fg:#1d2433; --line:#d6dbe7; --accent:#2f4fd8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12151d; --bar:#1b1f2a; --fg:#e6e9f2; --line:#2c3243; --accent:#7c93ff; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px "Segoe UI", "Noto Sans Arabic", system-ui, sans-serif; }
  .bar { position: sticky; top: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--bar); border-bottom: 1px solid var(--line); }
  .bar .g { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; border: 1px solid var(--line); border-radius: 7px; padding: 6px 12px; background: var(--bar); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  label { display: flex; gap: 6px; align-items: center; }
  input[type=text] { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bar); color: var(--fg); }
  iframe { display: block; width: min(940px, 100% - 24px); height: calc(100vh - 80px); margin: 12px auto; border: 0; border-radius: 10px; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
</style>
</head>
<body>
<div class="bar">
  <div class="g">
    <button data-lang="en">EN</button><button data-lang="ar">ع</button>
    <label><input type="checkbox" id="pendingOnly"><span data-t="pendingOnly"></span></label>
    <label><span data-t="fileName"></span><input type="text" id="fileName" placeholder="moodle-tasks_{semester}_{date}" style="width:240px"></label>
  </div>
  <div class="g">
    <button class="primary" id="print" data-t="printPdf"></button>
    <button id="dlHtml">HTML</button><button id="dlMd">Markdown</button><button id="dlJson">JSON</button>
  </div>
</div>
<iframe id="doc" title="report"></iframe>
<script type="module" src="report.js"></script>
</body>
</html>

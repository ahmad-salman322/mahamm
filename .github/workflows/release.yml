# Push a tag like v1.0.0 to build everything and publish a GitHub Release:
#   git tag v1.0.0 && git push origin v1.0.0
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - name: Check tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "package.json is $v but tag is ${GITHUB_REF_NAME}"; exit 1; }
      - run: npm test
      - run: node scripts/build-extension.mjs
      - run: node scripts/build-binaries.mjs
      - name: Checksums
        run: cd dist && sha256sum mahamm-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/mahamm-linux-x64
            dist/mahamm-linux-arm64
            dist/mahamm-windows-x64.exe
            dist/mahamm-macos-x64
            dist/mahamm-macos-arm64
            dist/mahamm-extension-chrome-*.zip
            dist/mahamm-extension-firefox-*.zip
            dist/SHA256SUMS.txt

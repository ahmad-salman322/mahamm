name: 🐞 Report a problem · الإبلاغ عن مشكلة
description: Something does not work in the program or the extension · شيء لا يعمل في البرنامج أو الإضافة
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** paste your Moodle key or password.
        شكرًا على الإبلاغ! لا تلصق مفتاح المودل أو كلمة السر.
  - type: textarea
    id: what
    attributes:
      label: What happened? · ماذا حدث؟
      description: What did you do, what did you expect, what happened instead? · ماذا فعلت، وماذا توقعت، وماذا حدث؟
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error message · رسالة الخطأ
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment · بيئة التشغيل
      description: Filled in automatically when you use the "Report a problem" button · تُعبّأ تلقائيًا من زر الإبلاغ
      render: text
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Where? · أين؟
      options:
        - Desktop program – window · البرنامج – النافذة
        - Desktop program – terminal · البرنامج – الطرفية
        - Browser extension · إضافة المتصفح
